plan_id: 20260922-animations-effects-best-practices
objective: >
  Research current frontend animations & effects best practices (baseline-aware against
  the prior 20260922-animations-effects-transitions findings), then implement only NEW
  fitting DOs in the vanilla zero-build dashboard; verified no-op is an allowed outcome.
complexity: MEDIUM
status: completed
created: 2026-09-22
base_commit: 4874c9c

context_envelope: context_envelope.json
working_dir: /home/Marayn/Desktop/Earn

baseline:
  prior_plan: docs/plan/20260922-animations-effects-transitions/plan.yaml
  prior_findings: docs/plan/20260922-animations-effects-transitions/findings.md
  prior_commit: 4874c9c
  prior_gate: approve score 100
  prior_counts: 8 DO / 10 SKIP, all 8 DOs shipped in 4874c9c
  done_baseline:
    - F1 composite-only entrances (rise-in + dial-draw)
    - F3 single ease token cubic-bezier(0.2,0.8,0.2,1)
    - F6 ::view-transition-group(week-detail) 180ms
    - F10 timeline :focus-visible gold-soft background parity
    - F11 moz range thumb hover/transition parity
    - F12 forced-colors timeline non-color cue
    - F15 :active press on timeline weeks (no lift)
    - F17 load-sequence budget <=800ms gate
    - dial-draw load delay 0.1s
    - timeline hover / focus-visible / active states
    - forced-colors timeline block
    - moz range thumb parity
    - ::view-transition-group(week-detail) 180ms
  done_baseline_rule: >
    Research must read prior findings.md first, mark the prior 8 shipped DOs
    DONE-BASELINE and the prior 10 SKIPs SKIP-BASELINE (reuse original skip
    rationale), and only surface NEW findings as actionable DO/SKIP. New research
    must not re-plan or duplicate shipped work.
  still_skip (prior, do not relitigate unless evidence changed):
    - libraries (GSAP/React/Tailwind/bundlers)
    - scroll-scrub / animation-timeline scroll()/view()
    - scattered hover-lift beyond .top3-card + .pws-link
    - data-table / section entrance stagger
    - will-change sprinkling
    - KPI count-up tweens
    - extra view-transition-names beyond week-detail
    - checklist bounce/pop flourishes
    - Save-Data motion stripping
    - skipTransition-on-interaction wiring

scope:
  in_scope_effects:
    - hover / active / focus feedback
    - entrance and micro-interactions
    - transitions
    - view-transition API
    - load-sequence motion
    - reduced-motion and forced-colors handling
  out_of_scope:
    - date changes
    - color-scheme changes
    - content / copy changes

tasks:
  - id: motion-research-2
    wave: 1
    agent: gem-researcher
    status: completed
    result: findings-md-8-done-10-skip-baseline-2-new-do-3-new-skip-gate-pass-100
    deps: []
    parallel_with: none
    description: >
      Fresh, baseline-aware research on frontend animations and effects best
      practices for this vanilla zero-build stack. Read
      docs/plan/20260922-animations-effects-transitions/findings.md (18 findings:
      8 DO / 10 SKIP, all DOs shipped in 4874c9c) BEFORE researching. Mark prior 8
      DOs DONE-BASELINE and prior 10 SKIPs SKIP-BASELINE (reuse original skip
      rationale); only NEW findings count as actionable DO/SKIP. Read-only task;
      runs alone in wave 1 (may run parallel with nothing else).
    research_axes:
      - NEW hover/active/focus feedback patterns not covered by prior F10/F15
      - NEW entrance/micro-interaction guidance beyond prior F1/F4/F18
      - NEW transition timing/easing research vs existing single ease token (F3)
      - view-transition API developments beyond prior F5/F6/F7
      - load-sequence motion beyond prior F17 budget gate
      - reduced-motion and forced-colors coverage gaps (re-check kill-switch ~styles.css:2243+)
      - browser Baseline updates that could change prior SKIP rationales (F8 scroll-driven, etc.)
      - perf guidance on composite-only / will-change that contradicts prior F1/F2
    output_contract: >
      Deliver findings.md at the mandatory path
      docs/plan/20260922-animations-effects-best-practices/findings.md.
      Each item MUST include: title, summary, source URL(s), baseline status
      (DONE-BASELINE, SKIP-BASELINE, or NEW), DO or SKIP verdict (NEW items
      only), fit rationale for this vanilla stack, target file:line or selector,
      reduced-motion requirement, risk notes. Baseline labels: prior 8 DOs shipped
      in 4874c9c = DONE-BASELINE; prior 10 SKIPs = SKIP-BASELINE (reuse original
      skip rationale, do not relitigate). Only NEW findings carry an actionable
      DO or SKIP verdict; only NEW findings may be re-opened with new evidence.
      New SKIP items must state why (needs library, violates one-moment rule,
      reintroduces scattered lifts, already correct, etc.).
    acceptance:
      - findings.md exists at docs/plan/20260922-animations-effects-best-practices/findings.md
      - every prior F1-F18 item labeled DONE-BASELINE (prior 8 DOs) or SKIP-BASELINE (prior 10 SKIPs); only NEW findings re-opened with new evidence are actionable
      - only NEW findings carry actionable DO/SKIP verdicts
      - every finding has fit rationale + reduced-motion note + verifiable source URL(s)
      - no recommendation requires GSAP, bundler, Tailwind, or React
      - no recommendation reintroduces scattered hover-lift anti-pattern
      - DO list (if any) implementable within index.html / styles.css / app.js only
      - "task is read-only: no source files modified"
    fallback_agent: general

  - id: motion-implement-2
    wave: 2
    agent: gem-implementer
    status: completed
    result: n1-n2-implemented-stylescss-plus6-verify-green
    deps: [motion-research-2]
    description: >
      Implement only NEW DO findings from motion-research-2 that were not already
      shipped in 4874c9c. If research yields zero new fitting DOs, this task
      legitimately passes as a verified no-op (explicitly allowed outcome; record
      result: no-op with evidence). Re-validate every selector/line anchor against
      the final files before editing (stale-anchor risk). Apply all hard
      constraints below; do not re-plan DONE-BASELINE items.
    hard_constraints:
      - KEEP_VANILLA: no animation libraries, no bundlers, no GSAP/React/Tailwind
      - 18 getElementById hooks + STATE_KEY "gate-earn-dashboard-v1" in app.js must remain intact (grep-verified)
      - prefers-reduced-motion kill-switch (~styles.css:2243+) must cover ALL new motion
      - one orchestrated motion moment only (dial-draw load sequence); load sequence budget <=800ms
      - single ease token cubic-bezier(0.2,0.8,0.2,1); entrances composite-only (transform/opacity)
      - lift policy: ONLY .top3-card and .pws-link may translateY(-1px); nothing else gains a lift
      - no will-change sprinkling, no animation-timeline, no scattered hover-lift
      - a11y: 44px targets, focus-visible gold ring, keyboard-operable controls, AA contrast
      - ASCII-only edits except existing Rs symbol
      - do not touch dates, color-scheme logic, or content/copy (out of scope)
    acceptance:
      - only NEW DO findings implemented; DONE-BASELINE and SKIP items untouched
      - zero new DOs => verified no-op passes with explicit evidence (allowed outcome)
      - "if edits made: load sequence still one moment, still <=800ms"
      - "if edits made: reduced-motion kill-switch covers all new motion"
      - "if edits made: 18 hooks + STATE_KEY intact (grep-verified)"
      - "if edits made: lift policy intact (only .top3-card + .pws-link translateY(-1px))"
      - all new motion uses the single ease token cubic-bezier(0.2,0.8,0.2,1); no new ad-hoc easing curves introduced
      - "a11y not regressed: AA contrast, 44px targets, focus-visible gold ring, keyboard controls"
      - ASCII-only edits except Rs symbol
      - verification commands all pass (see verification)
    verification:
      - npx prettier --check index.html styles.css app.js
      - npx tsc --allowJs --checkJs false --noEmit app.js
      - npx eslint app.js
      - git status / git diff reviewed
      - "DENIED (do not run): node --check, stylelint, python, &&-chained commands"
    fallback_agent: general

  - id: gate-ship-2
    wave: 3
    agent: gem-reviewer
    status: completed
    result: gate-pass-100-confidence-095-regression-low
    deps: [motion-implement-2]
    description: >
      Review the full wave diff (or verified no-op evidence) against acceptance
      criteria and the DO/SKIP contract. Re-run the verification suite. Confirm
      18 hooks + STATE_KEY + lift policy + reduced-motion coverage intact. On
      pass: stage explicit file paths only and commit as
      20260922-animations-effects-best-practices_wave-3. Push to origin only via
      ask-permission (do not push autonomously).
    acceptance:
      - all task acceptance criteria met (or no-op evidence accepted)
      - "verification suite green: npx prettier --check index.html styles.css app.js; npx tsc --allowJs --checkJs false --noEmit app.js; npx eslint app.js"
      - 18 getElementById hooks + STATE_KEY "gate-earn-dashboard-v1" intact (grep-verified)
      - all new motion uses the single ease token cubic-bezier(0.2,0.8,0.2,1); no new ad-hoc easing curves introduced
      - "lift policy intact: only .top3-card + .pws-link translateY(-1px)"
      - reduced-motion kill-switch still covers all motion
      - no libraries/scattered lifts reintroduced; scope (dates/scheme/copy) untouched
      - commit staged with explicit paths only; never .engram/ or node_modules/
      - "commit message: 20260922-animations-effects-best-practices_wave-3"
      - push only after ask-permission (git push = ask)
      - "DENIED: node --check, stylelint, python, &&-chained commands"
    fallback_agent: general

contracts:
  - from_task: motion-research-2
    to_task: motion-implement-2
    artifact: >
      findings.md at docs/plan/20260922-animations-effects-best-practices/findings.md
      with baseline status (DONE-BASELINE|SKIP-BASELINE|NEW), DO/SKIP per NEW item, file:line
      targets, reduced-motion requirements, and fit rationale
  - from_task: motion-implement-2
    to_task: gate-ship-2
    artifact: >
      working-tree diff of index.html / styles.css / app.js (or explicit no-op
      evidence with grep/verification output) plus green prettier/tsc/eslint results

waves:
  - wave: 1
    name: motion-research-2
    tasks: [motion-research-2]
    parallel: false
    note: sole wave-1 task; read-only research may run parallel with nothing else
    status: completed
  - wave: 2
    name: motion-implement-2
    tasks: [motion-implement-2]
    depends_on: [motion-research-2]
    status: completed
  - wave: 3
    name: gate-ship-2
    tasks: [gate-ship-2]
    depends_on: [motion-implement-2]
    status: completed

gate_verdict: pass
gate_score: 100
gate_confidence: 0.95
gate_regression_risk: LOW
gate_summary: >
  All 3 waves completed. Wave 1 research gate pass 100 (23 findings: 8 DONE-BASELINE,
  10 SKIP-BASELINE, 2 NEW DO, 3 NEW SKIP). Wave 2 implement gate pass 95 (styles.css
  +6 lines: N1 delay overrides + N2 color-only :active; prettier/tsc/eslint green).
  Wave 3 final gate pass 100 confidence 0.95: 7/7 reviewable acceptance items met with
  line citations, 0 critical findings, regression LOW; eslint independently re-run clean
  (0/0/0), prettier/tsc cited from wave-2 implementer evidence (app.js/index.html
  untouched since). Commit: 20260922-animations-effects-best-practices_wave-3.
  Push: ask-permission only.

risks:
  - id: free-tier-agent-failures
    detail: >
      gem-reviewer / gem-planner (and other gem-* agents) sometimes fail free-tier
      with "Expected 'id' to be a string" or "OpenCode's free tier can only be used
      from within OpenCode"
    mitigation: "fallback_agent: general on every task"
  - id: stale-line-anchors
    detail: research or prior-plan line numbers may drift against final index.html / styles.css / app.js
    mitigation: implement task re-validates all selectors/anchors against final files before editing
  - id: zero-new-do-noop
    detail: research may yield zero new fitting DOs after baseline filtering
    mitigation: >
      verified no-op is an explicitly allowed implement outcome; gate accepts it
      when evidence (findings.md baseline markers + green verification + clean diff) is shown
  - id: scope-creep-libraries-or-lifts
    detail: research may suggest libraries, scroll-scrub, animation-timeline, or scattered hover-lifts
    mitigation: KEEP_VANILLA + DO/SKIP contract + lift policy + prior SKIP list (do not relitigate without new evidence)
  - id: reduced-motion-regression
    detail: new keyframes/transitions could bypass the prefers-reduced-motion kill-switch (~styles.css:2243+)
    mitigation: acceptance requires kill-switch coverage of ALL new motion; gate re-checks
  - id: hooks-localstorage-break
    detail: edits to index.html/app.js could drop one of the 18 IDs or STATE_KEY "gate-earn-dashboard-v1"
    mitigation: grep gate in motion-implement-2 + gate-ship-2 acceptance
  - id: push-without-ask
    detail: prior gate pushed autonomously; this plan denies autonomous push
    mitigation: gate-ship-2 commits only; git push requires ask-permission
