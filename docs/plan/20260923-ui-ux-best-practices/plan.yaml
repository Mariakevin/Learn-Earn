risks:
  - id: free-tier-agent-failures
    detail: >
      gem-reviewer / gem-planner (and other gem-* agents) sometimes fail free-tier
      with "Expected 'id' to be a string" or "OpenCode's free tier can only be used
      from within OpenCode"
    mitigation: "fallback_agent: general on every task"
  - id: stale-line-anchors
    detail: research or prior-plan line numbers may drift against final index.html / styles.css / app.js
    mitigation: implement task re-validates all selectors/anchors against final files before editing
  - id: zero-new-do-noop
    detail: baseline-aware research may yield zero new fitting UI/UX DOs after filtering
    mitigation: >
      verified no-op is an explicitly allowed implement outcome; gate accepts it
      when evidence (findings.md baseline markers + green verification + clean diff) is shown
  - id: scope-creep-libraries-or-lifts
    detail: research may suggest libraries, frameworks, bundlers, or scattered hover-lifts
    mitigation: KEEP_VANILLA + DO/SKIP contract + lift policy + prior SKIP list (do not relitigate without new evidence)
  - id: reduced-motion-regression
    detail: any new transitions/keyframes could bypass the prefers-reduced-motion kill-switch (~styles.css:2247+)
    mitigation: acceptance requires kill-switch coverage of ALL motion touched; gate re-checks
  - id: hooks-localstorage-break
    detail: edits to index.html/app.js could drop one of the 18 IDs or STATE_KEY "gate-earn-dashboard-v1"
    mitigation: grep gate in uiux-implement-2 + gate-ship-2 acceptance
  - id: push-without-ask
    detail: prior gate pushed autonomously; this plan denies autonomous push
    mitigation: gate-ship-2 commits only; git push requires ask-permission
  - id: contrast-regression
    detail: new UI/UX states (hover/focus/active/disabled fills) could drop text or UI below WCAG AA, especially in the light theme
    mitigation: acceptance requires WCAG AA contrast intact; gate re-checks any touched color pair with file:line evidence
  - id: focus-order-regression
    detail: HTML structure or tabindex changes could scramble keyboard focus order or break the focus-visible gold ring (styles.css:132-135)
    mitigation: prefer CSS-only fixes; gate verifies focus ring intact and no tabindex/DOM-order churn without explicit justification
  - id: responsive-breakage
    detail: spacing, size, or layout tweaks could break mobile/narrow breakpoints or overflow existing sections
    mitigation: implementer re-checks affected breakpoints; CSS-only surgical edits; gate reviews diff for layout-scope creep
  - id: scope-creep-into-copy
    detail: readability/hierarchy findings tempt content or copy rewrites, date edits, or brand identity changes
    mitigation: out-of-scope block is hard; gate rejects any diff touching dates, scheme logic, copy, or the gold/dark Gate Earn identity
