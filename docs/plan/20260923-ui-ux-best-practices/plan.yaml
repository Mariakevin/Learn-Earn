plan_id: 20260923-ui-ux-best-practices
objective: >
  Research current top frontend UI/UX best practices (baseline-aware against what this
  dashboard already ships), then implement only NEW fitting DOs in the vanilla zero-build
  dashboard; verified no-op is an allowed outcome per finding.
complexity: MEDIUM
status: completed
gate_verdict: pass
gate_score: 100
gate_confidence: 0.96
gate_regression_risk: LOW
gate_summary: >
  All 3 waves completed. Wave 1 research gate pass 97 (findings.md: 10 DONE-BASELINE,
  13 SKIP-BASELINE, 4 NEW DO U1-U4, 5 NEW SKIP U5-U9, total 32). Wave 2 implement
  gate pass 100 (index.html+styles.css only: 6x role=status, 3x max-width 70ch,
  week h4->h3, skip-link 44px; prettier/tsc/eslint green). Wave 3 final gate pass 100
  confidence 0.96: 12/12 acceptance, eslint independently re-run clean, prettier/tsc
  cited from implementer fresh runs (npx denied in reviewer sandbox), inventory exact,
  ship_ready true. Commit: 20260923-ui-ux-best-practices_wave-3. Push: ask-permission only.
created: 2026-09-23
base_commit: 91cfca2

context_envelope: context_envelope.json
working_dir: /home/Marayn/Desktop/Earn

baseline:
  prior_plans:
    - id: 20260922-animations-effects-transitions
      plan: docs/plan/20260922-animations-effects-transitions/plan.yaml
      findings: docs/plan/20260922-animations-effects-transitions/findings.md
      commit: 4874c9c
      gate: approve score 100
      counts: 18 findings - 8 DO shipped / 10 SKIP
    - id: 20260922-animations-effects-best-practices
      plan: docs/plan/20260922-animations-effects-best-practices/plan.yaml
      findings: docs/plan/20260922-animations-effects-best-practices/findings.md
      commit: 91cfca2
      gate: pass score 100 confidence 0.95
      counts: 23 findings - 8 DONE-BASELINE / 10 SKIP-BASELINE / 2 NEW DO / 3 NEW SKIP
  done_baseline_motion:
    - F1 composite-only entrances (rise-in + dial-draw)
    - F3 single ease token cubic-bezier(0.2,0.8,0.2,1) (styles.css:50)
    - F6 ::view-transition-group(week-detail) 180ms
    - F10 timeline :focus-visible gold-soft background parity
    - F11 moz range thumb hover/transition parity
    - F12 forced-colors timeline non-color cue
    - F15 :active press on timeline weeks (no lift)
    - F17 load-sequence budget <=800ms gate
    - N1 RM kill-switch delay overrides (styles.css:2256,2259)
    - N2 .theme-toggle:active color-only (styles.css:285-287)
  skip_baseline_note: >
    Prior motion SKIPs stay SKIP-BASELINE with their original rationales (10 from the
    F1-F18 set plus the 3 NEW SKIPs N3-N5); do not relitigate without new evidence.
    Prior motion findings keep their F/N IDs - this plan must not renumber them; new
    UI/UX findings use their own IDs (U1, U2, ...).
  labeling_rule: >
    Research must read both prior findings.md files first, mark shipped prior DOs
    DONE-BASELINE (cite file:line) and prior SKIPs SKIP-BASELINE (reuse original skip
    rationale), and only surface NEW UI/UX findings as actionable DO/SKIP. New research
    must not re-plan or duplicate shipped work. Motion findings stay in their lanes;
    only reference the motion baseline when a UI/UX finding would collide with it.

scope:
  in_scope_uiux:
    - usability heuristics (Nielsen) applied to existing controls and flows
    - visual hierarchy and layout density
    - affordance and discoverability of interactive elements
    - touch targets and pointer ergonomics (44px minimum)
    - contrast and readability (WCAG AA)
    - focus order and focus management
    - forms and controls UX (checklist, steppers, sliders)
    - responsive behavior and mobile-first layout
    - content readability (structure/measure only - not copy rewrites)
  out_of_scope:
    - date changes
    - color-scheme logic changes
    - content / copy rewrites
    - visual redesign of the brand (gold/dark Gate Earn identity stays)

tasks:
  - id: uiux-research-2
    wave: 1
    agent: gem-researcher
    status: completed
    result: findings-md-10-done-13-skip-baseline-4-new-do-5-new-skip-gate-pass-97
    deps: []
    parallel_with: none
    description: >
      Fresh, baseline-aware research on top frontend UI/UX best practices for this
      vanilla zero-build stack. Read BOTH prior findings.md files BEFORE researching:
      docs/plan/20260922-animations-effects-transitions/findings.md (F1-F18: 8 DO
      shipped in 4874c9c / 10 SKIP) and
      docs/plan/20260922-animations-effects-best-practices/findings.md (23 entries:
      8 DONE-BASELINE / 10 SKIP-BASELINE / 2 NEW DO / 3 NEW SKIP, shipped in 91cfca2).
      Mark prior shipped DOs DONE-BASELINE (cite file:line) and prior SKIPs
      SKIP-BASELINE (reuse original skip rationale); only NEW UI/UX findings count as
      actionable DO/SKIP. Use this plan's own finding IDs (U1, U2, ...) - do not
      renumber F1-F18 or N1-N5. Read-only task; runs alone in wave 1 (may run parallel
      with nothing else).
    research_axes:
      - Nielsen heuristics audit of existing dashboard controls and flows (system status, match, control, forgiveness, visibility)
      - WCAG 2.2 AA gaps beyond shipped focus-visible/forced-colors work (contrast pairs, target size, focus order)
      - mobile-first / touch-target research vs the 44px minimum already in constraints
      - visual hierarchy and layout density guidance vs current section/card structure
      - focus management and keyboard operability beyond the global focus-visible ring (styles.css:132-135)
      - forms/controls UX (checklist, steppers, sliders) - labels, states, error/affordance clarity
      - content readability (line length, type scale, spacing rhythm) without copy rewrites
      - responsive behavior breakpoints vs current layout
      - affordance consistency across nav, cards, timeline, and calc controls
      - browser/vendor Baseline updates that could change prior SKIP rationales where UI/UX intersects motion (reference-only; motion stays in prior lanes)
    output_contract: >
      Deliver findings.md at the mandatory path
      docs/plan/20260923-ui-ux-best-practices/findings.md. Each item MUST include:
      title, summary, source URL(s) with absolute web.dev/W3C/Nielsen/MDN-class
      addresses, baseline status (DONE-BASELINE, SKIP-BASELINE, or NEW), DO or SKIP
      verdict (NEW items only), fit rationale for this vanilla stack, target file:line
      or selector with anchors re-validated against the final files, reduced-motion /
      collision note where relevant, and risk notes. Label vocabulary exactly:
      DONE-BASELINE | SKIP-BASELINE | NEW (then DO|SKIP only for NEW). Prior motion
      findings keep F/N IDs; new findings use U-IDs. New SKIP items must state why
      (violates hard constraint, needs JS freeze exception, already correct, out of
      scope, etc.).
    acceptance:
      - findings.md exists at docs/plan/20260923-ui-ux-best-practices/findings.md
      - every prior F1-F18 / N1-N5 motion item keeps its verdict as DONE-BASELINE (prior shipped DOs, cite file:line) or SKIP-BASELINE (prior skips, original rationale reused); not renumbered
      - only NEW findings use U-IDs and carry actionable DO/SKIP verdicts
      - label vocabulary exactly DONE-BASELINE | SKIP-BASELINE | NEW (then DO|SKIP only for NEW)
      - every finding has fit or skip rationale + re-validated file:line target anchors + verifiable absolute source URL(s)
      - every claim that something already ships cites file:line in this working tree
      - every NEW finding notes reduced-motion / motion-baseline collision where relevant
      - no recommendation requires React, Tailwind, GSAP, anime.js, htmx, or any bundler
      - no recommendation reintroduces scattered hover-lift, a second ease curve, or unscoped motion
      - JS-touching findings (if any) carry explicit justification and are flagged high-risk (likely SKIP)
      - DO list (if any) implementable within index.html / styles.css / app.js only; CSS/HTML-only preferred
      - "task is read-only: no source files modified"
    fallback_agent: general

  - id: uiux-implement-2
    wave: 2
    agent: gem-implementer
    status: completed
    result: u1-u4-implemented-indexhtml-stylescss-verify-green-gate-pass-100
    deps: [uiux-research-2]
    description: >
      Implement only NEW DO findings from uiux-research-2 that were not already shipped
      in 4874c9c or 91cfca2. If research yields zero new fitting DOs, this task
      legitimately passes as a verified no-op (explicitly allowed outcome; record
      result: no-op with evidence). Re-validate every selector/line anchor against the
      final files before editing (stale-anchor risk). Capture TDD-red evidence (a grep
      proving the change is absent) before each edit, then green verification after.
      app.js is effectively frozen: prefer CSS/HTML-only fixes; any JS-touching DO must
      be explicitly justified by the finding and treated as high-risk. Apply all hard
      constraints below; do not re-plan DONE-BASELINE items.
    hard_constraints:
      - "KEEP_VANILLA: no frameworks/libraries/bundlers (no React/Tailwind/GSAP/anime.js/htmx); npm only for prettier/eslint/tsc"
      - 18 getElementById hooks + STATE_KEY "gate-earn-dashboard-v1" (app.js:8) must remain intact (grep-verified)
      - "app.js effectively frozen: prefer CSS/HTML-only; JS-touching findings need explicit justification (high-risk, likely SKIP)"
      - prefers-reduced-motion kill-switch (~styles.css:2247+) must cover ALL motion, new or existing
      - "if any motion touched: single ease token cubic-bezier(0.2,0.8,0.2,1) (styles.css:50); one orchestrated load moment (dial-draw) only; budget <=800ms"
      - "lift policy: ONLY .top3-card (~styles.css:866) and .pws-link (~styles.css:2024) may translateY(-1px); nothing else gains a lift"
      - no will-change sprinkling, no animation-timeline, no scattered hover-lift
      - "a11y first-class: 44px min targets, focus-visible gold ring (styles.css:132-135), keyboard operability, WCAG AA contrast"
      - "ASCII-only edits except existing Rs (rupee) symbol"
      - "out of scope: no date changes, no color-scheme logic changes, no content/copy rewrites, no brand visual redesign (gold/dark Gate Earn identity stays)"
    acceptance:
      - only NEW DO findings implemented; DONE-BASELINE and SKIP items untouched
      - zero new DOs => verified no-op passes with explicit evidence (allowed outcome)
      - "if edits made: TDD-red evidence captured before edit (grep proving absence)"
      - "if edits made: 18 hooks + STATE_KEY intact (grep-verified)"
      - "if edits made: lift policy intact (only .top3-card + .pws-link translateY(-1px))"
      - "if edits made: reduced-motion kill-switch covers all motion touched"
      - "if any motion touched: all of it uses the single ease token cubic-bezier(0.2,0.8,0.2,1); no new ad-hoc easing curves"
      - "a11y not regressed: 44px targets, focus-visible gold ring (styles.css:132-135), keyboard operability, WCAG AA contrast"
      - no libraries/frameworks/bundlers introduced; npm still only prettier/eslint/tsc
      - "scope untouched: no date changes, no color-scheme logic changes, no content/copy rewrites, brand identity intact"
      - "ASCII-only edits except Rs (rupee) symbol"
      - verification commands all pass (see verification)
    verification:
      - npx prettier --check index.html styles.css app.js
      - npx tsc --allowJs --checkJs false --noEmit app.js
      - npx eslint app.js
      - git status / git diff reviewed
      - "DENIED (do not run): node --check, stylelint, python, &&-chained commands"
    fallback_agent: general

  - id: gate-ship-2
    wave: 3
    agent: gem-reviewer
    status: completed
    result: gate-pass-100-confidence-096-regression-low-ship-ready
    deps: [uiux-implement-2]
    description: >
      Review the full wave diff (or verified no-op evidence) against acceptance
      criteria and the DO/SKIP contract. Re-run the verification suite; sandbox may
      deny npx - prettier/tsc may cite implementer evidence when independently
      re-running is denied, but greps must be re-checked independently and eslint
      re-run if possible. Confirm 18 hooks + STATE_KEY + lift policy + single ease
      + reduced-motion coverage + scope untouched. Evidence rule: every claim needs a
      file:line citation. On pass: stage explicit file paths only and commit as
      20260923-ui-ux-best-practices_wave-3. Push to origin only via ask-permission
      (do not push autonomously).
    acceptance:
      - all task acceptance criteria met (or no-op evidence accepted)
      - "verification suite green: npx prettier --check index.html styles.css app.js; npx tsc --allowJs --checkJs false --noEmit app.js; npx eslint app.js"
      - '18 getElementById hooks + STATE_KEY "gate-earn-dashboard-v1" intact (grep-verified)'
      - "lift policy intact: only .top3-card + .pws-link translateY(-1px)"
      - "single ease check: no second easing curve introduced; cubic-bezier(0.2,0.8,0.2,1) remains sole ease"
      - "reduced-motion kill-switch still covers all motion (~styles.css:2247+)"
      - no libraries/frameworks/bundlers introduced; scope (dates/scheme/copy/brand) untouched
      - "every claim cited with file:line (evidence_rule); prettier/tsc may cite implementer evidence if npx denied, greps re-checked independently, eslint re-run if possible"
      - "commit staged with explicit paths only; never .engram/ or node_modules/"
      - "commit message: 20260923-ui-ux-best-practices_wave-3"
      - push only after ask-permission (git push = ask)
      - "DENIED: node --check, stylelint, python, &&-chained commands"
    fallback_agent: general

