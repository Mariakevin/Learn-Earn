    - git push (ask only; currently ahead 2 - do NOT push)

design_direction:
  status: locked
  locked_by: orchestrator
  user_approval: "proceed"
  option: "Option 2 Hero rework with dial-as-thesis emphasis"
  pillars:
    - id: type
      intent: >
        Stronger display hierarchy on h1 (scale/weight contrast); gold accent
        ONLY on "Earn"; eyebrow refined as section mark; subtitle and meta
        quieter and tighter
    - id: dial-thesis
      intent: >
        Clearer track vs progress contrast; calmer inner ring; better
        node-label spacing hierarchy; center value as numeric hero (larger 143,
        tighter DAYS TO GATE treatment) - existing SVG/CSS only
    - id: composition
      intent: >
        Better copy|dial balance and vertical rhythm; mobile stack remains
        dial-legible
    - id: motion
      intent: >
        dial-draw stays THE single orchestrated load moment <=800ms; no new
        scattered animations/lifts; single ease only

