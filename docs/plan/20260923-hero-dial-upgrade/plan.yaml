    - index.html:55-129 hero section structure/classes only (eyebrow, h1/h1-accent, subtitle, hero-meta Goal chip, hero-dial SVG loop-dial) - markup edits allowed only when required by the locked design direction; copy text frozen
    - styles.css .hero block ~221-433 (hero-grid, eyebrow, h1, h1-accent, subtitle, hero-meta, loop-dial, dial-track/progress/inner/node/node-label/center-value/label/sub)
    - styles.css responsive hero anchors ~2006-2032 (@media width >= 768 .hero padding; width >= 960 .hero-grid / .hero-dial / .loop-dial)
    - type hierarchy, dial track/progress contrast, inner-ring calm, node-label spacing, center value numeric-hero treatment, copy|dial balance and vertical rhythm, mobile stack dial legibility
