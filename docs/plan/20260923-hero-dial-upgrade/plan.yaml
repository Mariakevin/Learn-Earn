risks:
  - id: free-tier-agent-failure
    detail: >
      gem-designer and gem-planner are known free-tier broken; gem-implementer
      and gem-reviewer can still fail transiently; reviewer sandbox denies npx
    mitigation: >
      fallback_agent: general on every task (explicit for design-spec); gate
      cites implementer suite stdout when npx denied and re-runs greps
      independently; orchestrator re-dispatches failed waves
  - id: scope-creep-appjs-copy
    detail: >
      hero markup edits could drift into app.js hooks, copy rewrites, date
      changes, or color-scheme logic instead of presentation-only work
    mitigation: >
      app.js FROZEN with 18-hook + STATE_KEY canaries on implement and gate;
      copy/dates/scheme frozen in scope.out_of_scope and every acceptance[];
      gate rejects any out-of-scope file or text change with file:line
  - id: motion-budget-regression
    detail: >
      dial styling or entrance tweaks could add a second load animation, push
      load sequence past 800ms, or scatter new transitions
    mitigation: >
      dial-draw remains THE single load moment <=800ms as binding hard
      constraint; rg canaries for animation/keyframes additions; gate checks
      every new animation declaration against the motion baseline
  - id: lift-ease-canary-break
    detail: >
      polish could introduce a third translateY(-1px) lift on hero elements or
      a second cubic-bezier curve
    mitigation: >
      lifts exactly 2 (styles.css:779, styles.css:1914) and cubic-bezier
      count == 1 (styles.css:51) are gateable acceptance greps on implement
      and gate; hero must gain no lift
  - id: aa-contrast-type-changes
    detail: >
      stronger h1 scale/weight, quieter subtitle/meta, and dial center-value
      resizing can push text below WCAG AA in dark or light theme
    mitigation: >
      AA both themes required in every acceptance[]; design-spec must state
      token pairs used; gate verifies touched type pairs with file:line cites
  - id: mobile-dial-legibility
    detail: >
      composition and type changes can shrink or crowd the dial in the stacked
      mobile layout so 143 / DAYS TO GATE / node labels become unreadable
    mitigation: >
      design-spec mobile notes required for width <= 480 / <= 639 and
      responsive anchors ~2006-2032; gate checks .loop-dial width and center
      text sizing still legible in stacked flow
  - id: stale-baseline-anchors
    detail: >
      prior rate-improve envelope line numbers (styles.css:50/786/1946/2160)
      are stale versus this tree (51/779/1914/2102); implementer or gate could
      cite wrong lines and false-fail a canary
    mitigation: >
      plan labels prior anchors as baseline and revalidated current values;
      design-spec task requires revalidate-against-this-tree; evidence_rule
      file:line must match the working tree at review time
  - id: unauthorized-push
    detail: >
      ship step could autonomously push while main is already ahead 2
      unpushed commits (d6dbf89, f694185)
    mitigation: >
      push_policy ask-only on every task acceptance; gate acceptance forbids
      push; orchestrator commit only, push deferred until user asks

ship:
  stage_paths:
    - index.html
    - styles.css
    - docs/plan/20260923-hero-dial-upgrade/
  stage_policy: explicit file paths only; never .engram/ or node_modules/
  commit_message: 20260923-hero-dial-upgrade_wave-3
  commit_owner: orchestrator after gate-ship approve
  push_policy: ask-permission only; never autonomous; do NOT push in this plan (ahead 2)

verification:
  suite:
    - npx prettier --check index.html styles.css app.js
    - npx tsc --allowJs --checkJs false --noEmit app.js
    - npx eslint app.js
  canaries:
    - "rg -c getElementById app.js -> 18"
    - 'rg STATE_KEY app.js -> "gate-earn-dashboard-v1" at app.js:8'
    - "rg -c 'translateY(-1px)' styles.css -> 2 (styles.css:779, styles.css:1914)"
    - "rg -c cubic-bezier styles.css -> 1 (styles.css:51)"
    - "rg -c prefers-reduced-motion styles.css -> >=1 (styles.css:2102)"
    - "rg 'will-change|animation-timeline' styles.css -> no matches"
    - "git diff --name-only -> only index.html, styles.css, docs/plan/20260923-hero-dial-upgrade/*"
  denied:
    - node --check
    - stylelint
    - python3
    - "&&-chained commands"
